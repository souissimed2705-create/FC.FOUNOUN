name: CI

on:
  pull_request:
    branches:
      - fix/full-project-repair
      - main
  push:
    branches:
      - fix/operations-contracts
      - fix/operations-contracts-rbac

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Unit and security tests
        run: npm test
      - name: Production build
        run: npm run build
