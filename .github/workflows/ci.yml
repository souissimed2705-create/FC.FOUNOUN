name: CI

on:
  pull_request:
    branches:
      - fix/full-project-repair
      - fix/operations-contracts-rbac
      - main
  push:
    branches:
      - fix/operations-contracts
      - fix/operations-contracts-rbac
      - fix/pbkdf2-firestore-diagnostics

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Match Firebase's declared Node.js engine floor; keep npm pinned below for lockfile reproducibility.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Pin npm for lockfile compatibility
        run: npm install --global npm@10.9.9
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Unit and security tests
        run: npm test
      - name: Production build
        run: npm run build
